<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Litani C.A. - Inicio de Sesión</title>
  <!-- logo de pestaña -->
  <link rel="icon" type="image/png" href="img/logo.png">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      /* Fondo oscuro con degradado inspirado en la imagen */
      background: linear-gradient(135deg, #182026 0%, #222e36 50%, #153745 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-card {
      background: #1e272e; /* Tarjeta oscura elegante */
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 360px;
      max-width: 92vw;
      border-top: 4px solid #00a8c6; /* Cyan del logo */
      text-align: center;
    }
    .logo-container {
      margin-bottom: 15px;
    }
    .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      border: 2px solid #00a8c6;
    }
    .brand-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .brand-subtitle {
      color: #9ba8b5;
      font-size: 13px;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #00a8c6; /* Color cian para resaltar etiquetas */
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      background-color: #2c3842;
      border: 1px solid #4a5a68;
      border-radius: 6px;
      font-size: 14px;
      color: #ffffff;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #00a8c6;
      box-shadow: 0 0 8px rgba(0, 168, 198, 0.4);
    }
    input::placeholder {
      color: #6c7d8c;
    }
    .btn-login {
      background: linear-gradient(90deg, #008ca5 0%, #00a8c6 100%);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn-login:hover {
      box-shadow: 0 4px 12px rgba(0, 168, 198, 0.4);
      transform: translateY(-1px);
    }
    .alert {
      padding: 10px;
      margin-top: 15px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      text-align: center;
    }
    .alert-danger {
      background-color: #4a1d24;
      color: #ff8b8b;
      border: 1px solid #7d2a37;
    }
    .alert-success {
      background-color: #123d33;
      color: #63e6be;
      border: 1px solid #1f6b57;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Logo superior -->
    <div class="logo-container">
      <img src="img/logo.png" alt="Logo Litani" class="logo-img">
    </div>

    <div class="brand-title">LITANI C.A.</div>
    <div class="brand-subtitle">Sistema de Bitácora Logística</div>

    <form id="formLogin">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ej: chequeador_01" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login">Ingresar al Sistema</button>
    </form>

    <div id="mensajeAlert" class="alert"></div>
  </div>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async function (e) {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value.trim();
      const clave = document.getElementById('clave').value.trim();
      const alertBox = document.getElementById('mensajeAlert');

      try {
        const response = await fetch('/api/usuarios/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usuario, password: clave })
        });

        if (!response.ok) {
          throw new Error('Credenciales inválidas');
        }

        const data = await response.json();

        // Guardar la sesión para las demás páginas
        sessionStorage.setItem('usuario', JSON.stringify({
          id: data.idUsuario,
          username: data.username,
          nombre: data.nombreCompleto || data.username,
          rol: data.idRol
        }));

        alertBox.className = 'alert alert-success';
        alertBox.textContent = '✓ ' + data.message;
        alertBox.style.display = 'block';

        setTimeout(function () {
          window.location.href = 'inicio.html';
        }, 1200);
      } catch (error) {
        console.error(error);
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = '✕ Usuario o contraseña incorrectos.';
        alertBox.style.display = 'block';
      }
    });
  </script>

</body>
</html>
